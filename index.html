        /* --- GENEL AYARLAR (YEŞİL TEMA) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f5e9;
            margin: 0;
            padding: 15px;
            color: #1b5e20;
        }

        /* --- ORTAK BANNER STİLİ (HEM ÜST HEM ALT BAŞLIK İÇİN) --- */
        .common-banner {
            background-color: #2e7d32;
            color: white;
            padding: 40px 20px; /* Yükseklik algısı için dolgu artırıldı */
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            
            /* Genişlik ve Hizalama Ayarı */
            max-width: 1200px; /* Alttaki kartlar (container) ile aynı genişlik sınırı */
            margin: 0 auto 30px auto; /* Ortala ve alttan boşluk bırak */
            width: 100%; /* Mobilde tam otursun */
            box-sizing: border-box; /* Padding taşmasın */
        }

        /* --- ORTAK BAŞLIK YAZISI STİLİ --- */
        .banner-title {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.3;
        }

        /* --- ORTAK ALT YAZI STİLİ --- */
        .banner-subtitle {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 500;
            opacity: 1; /* Tam beyaz */
            line-height: 1.6;
            font-style: normal;
        }

        /* --- IZGARA İÇİNDEKİ AYIRICI İÇİN EK AYAR --- */
        .section-separator {
            grid-column: 1 / -1; /* Tüm satırı kapla */
            margin-top: 40px;    /* Kartlardan biraz uzaklaşsın */
            margin-bottom: 25px; 
            /* Diğer tüm özelliklerini .common-banner sınıfından alacak */
        }

        /* --- KART IZGARASI --- */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* --- KART TASARIMI --- */
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-bottom: 5px solid #2e7d32;
        }

        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover; 
            object-position: center center; 
            background-color: #c8e6c9;
        }

        /* Özel Odaklama Sınıfı */
        .card-image.yukari-odakla {
            object-fit: cover !important; 
            object-position: top center !important; 
        }

        .card-content {
            padding: 20px;
            text-align: left;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
            color: #1b5e20;
            font-weight: 800;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .card-location {
            font-size: 1rem;
            color: #555;
            margin-bottom: 15px;
            display: block;
            font-weight: 600;
        }

        .info-note {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            border-left: 4px solid #2e7d32;
            font-weight: 700;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        .btn-car { background-color: #1565c0; }
        .btn-bus { background-color: #2e7d32; }

    </style>
